name: swordtrack
description: "STEM smart notebook — infinite canvas, handwriting recognition, equation graphing, chemistry & CAD tools for engineering students."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Networking
  dio: ^5.7.0
  image_picker: ^1.1.0

  # Math
  math_expressions: ^2.6.0
  flutter_math_fork: ^0.7.4

  # Canvas & pen input
  ink: ^1.0.0
  fl_chart: ^1.2.0
  flutter_animate: ^4.5.2

  # UI
  google_fonts: ^6.2.1
  get_it: ^8.0.0

  # Storage
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  sqflite: ^2.3.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
